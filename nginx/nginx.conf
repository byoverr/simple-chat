worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Upstream for auth-service (Docker DNS round-robins across replicas)
    upstream auth_upstream {
        server auth-service:8080;
    }

    # Upstream for chat-service
    upstream chat_upstream {
        server chat-service:8081;
    }

    server {
        listen 80;
        server_name _;

        # ─── Static frontend ────────────────────────────────────────────────
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ─── Auth service API ────────────────────────────────────────────────
        location /api/auth/ {
            proxy_pass         http://auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ─── Chat service SSE (must disable buffering) ───────────────────────
        location ~ ^/api/chats/[^/]+/events$ {
            proxy_pass         http://chat_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        '';

            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding on;
        }

        # ─── Chat service API ────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://chat_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
