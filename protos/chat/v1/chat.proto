syntax = "proto3";

package chat.v1;

option go_package = "byoverr/chat/v1;chatv1"; // <- поправь под свой модуль

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service ChatService {
  // Список чатов + последнее сообщение по каждому чату.
  rpc ListChats(ListChatsRequest) returns (ListChatsResponse);

  // Получить чат/комнату по id
  rpc GetChat(GetChatRequest) returns (Chat);

  // Создать чат (direct/group/channel)
  rpc CreateChat(CreateChatRequest) returns (Chat);

  // Вступить/выйти (для групп/каналов)
  rpc JoinChat(JoinChatRequest) returns (google.protobuf.Empty);
  rpc LeaveChat(LeaveChatRequest) returns (google.protobuf.Empty);

  // История сообщений
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);

  // Получить только последнее сообщение в чате
  rpc GetLastMessage(GetLastMessageRequest) returns (GetLastMessageResponse);

  // Реалтайм соединение: клиент шлёт события (send/typing/read/ping),
  // сервер пушит обновления (new message/typing/read/chat updates).
  rpc Connect(stream ClientEvent) returns (stream ServerEvent);
}

// ---------- Chats ----------

enum ChatType {
  CHAT_TYPE_UNSPECIFIED = 0;
  CHAT_TYPE_DIRECT = 1;   // 1:1
  CHAT_TYPE_GROUP = 2;    // group
  CHAT_TYPE_CHANNEL = 3;  // channel (broadcast)
}

message Chat {
  string id = 1;
  ChatType type = 2;

  string title = 3;
  string avatar_url = 4;

  string created_by = 5;
  google.protobuf.Timestamp created_at = 6;

  int64 members_count = 7;
}

message ChatSummary {
  Chat chat = 1;

  // Последнее сообщение
  MessagePreview last_message = 2;

  // "Сколько непрочитано"
  int64 unread_count = 3;

  // последнее прочитанное сообщение/seq
  string last_read_message_id = 4;
}

// ---------- Messages ----------

message Message {
  string id = 1;
  string chat_id = 2;
  string sender_id = 3;

  string client_msg_id = 4;

  string text = 5;

  // "догрузить от позиции"
  int64 seq = 6;

  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp edited_at = 8;

  // Reply
  string reply_to_message_id = 9;
}

message MessagePreview {
  string message_id = 1;
  string sender_id = 2;
  string text_preview = 3;
  google.protobuf.Timestamp created_at = 4;
  int64 seq = 5;
}

message ListChatsRequest {
  int32 limit = 1;
  string page_token = 2;
}

message ListChatsResponse {
  repeated ChatSummary items = 1;
  string next_page_token = 2;
}

message GetChatRequest {
  string chat_id = 1;
}

message CreateChatRequest {
  ChatType type = 1;

  string title = 2;

  repeated string member_user_ids = 3;
}

message JoinChatRequest {
  string chat_id = 1;
}

message LeaveChatRequest {
  string chat_id = 1;
}

message GetHistoryRequest {
  string chat_id = 1;
  int32 limit = 2;

  oneof cursor {
    string before_message_id = 3;
    int64 before_seq = 4;
  }
}

message GetHistoryResponse {
  repeated Message messages = 1;
  bool has_more = 2;

  string next_before_message_id = 3;
  int64 next_before_seq = 4;
}

message GetLastMessageRequest {
  string chat_id = 1;
}

message GetLastMessageResponse {
  Message message = 1;
}

// -------------------------

message ClientEvent {
  oneof payload {
    SendMessage send_message = 1;
    Typing typing = 2;
    Read read = 3;
    Ack ack = 4;
    Ping ping = 5;
  }
}

message ServerEvent {
  oneof payload {
    MessageCreated message_created = 1;
    TypingEvent typing_event = 2;
    ReadEvent read_event = 3;
    ChatUpdated chat_updated = 4;
    Pong pong = 5;
    ServerError error = 6;
  }
}

message SendMessage {
  string chat_id = 1;
  string client_msg_id = 2;
  string text = 3;
  string reply_to_message_id = 4;
}

message MessageCreated {
  Message message = 1;
}

message Typing {
  string chat_id = 1;
  bool is_typing = 2;
}

message TypingEvent {
  string chat_id = 1;
  string user_id = 2;
  bool is_typing = 3;
  google.protobuf.Timestamp at = 4;
}

message Read {
  string chat_id = 1;

  oneof up_to {
    string message_id = 2;
    int64 seq = 3;
  }
}

message ReadEvent {
  string chat_id = 1;
  string user_id = 2;
  string up_to_message_id = 3;
  int64 up_to_seq = 4;
  google.protobuf.Timestamp at = 5;
}

message Ack {
  string message_id = 1;
}

message Ping {
  int64 ts_unix_ms = 1;
}

message Pong {
  int64 ts_unix_ms = 1;
}

message ChatUpdated {
  Chat chat = 1;
}

message ServerError {
  string code = 1;    // например "INVALID_ARGUMENT"
  string message = 2;
}